<svg width="100%" viewBox="0 0 680 350" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">HTTP content negotiation</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Flowchart: client sends a request with Accept-star headers, server finds the best available representation. If a match is found it returns 200 OK with Content-Type and Vary headers set; if no format satisfies the request it returns 406 Not Acceptable.</desc>
<defs><marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><mask id="imagine-text-gaps-hv3sgj" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="350" fill="white"/><rect x="266.890625" y="22" width="146.22952270507812" height="22" fill="black" rx="2"/><rect x="271.625" y="43" width="136.75" height="18" fill="black" rx="2"/><rect x="259.8046875" y="122" width="160.4044189453125" height="22" fill="black" rx="2"/><rect x="264.9609375" y="143" width="150.078125" height="18" fill="black" rx="2"/><rect x="249.65625" y="197" width="40.6875" height="18" fill="black" rx="2"/><rect x="401.3203125" y="197" width="57.359375" height="18" fill="black" rx="2"/><rect x="181.3125" y="252" width="57.57084655761719" height="22" fill="black" rx="2"/><rect x="141.078125" y="273" width="137.84375" height="18" fill="black" rx="2"/><rect x="439.734375" y="252" width="140.53125" height="22" fill="black" rx="2"/><rect x="448.96875" y="273" width="122.724609375" height="18" fill="black" rx="2"/></mask></defs>

