      <use href="#petalSmall" transform="rotate(22.5)"/>
      <use href="#petalSmall" transform="rotate(67.5)"/>
      <use href="#petalSmall" transform="rotate(112.5)"/>
      <use href="#petalSmall" transform="rotate(157.5)"/>
      <use href="#petalSmall" transform="rotate(202.5)"/>
      <use href="#petalSmall" transform="rotate(247.5)"/>
      <use href="#petalSmall" transform="rotate(292.5)"/>
      <use href="#petalSmall" transform="rotate(337.5)"/>
