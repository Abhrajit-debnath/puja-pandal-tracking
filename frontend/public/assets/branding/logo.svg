    <path id="petal" d="M0,0 C-26,-52 -21,-104 0,-150 C21,-104 26,-52 0,0 Z"/>
    <path id="petalSmall" d="M0,0 C-16,-34 -13,-68 0,-97 C13,-68 16,-34 0,0 Z"/>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="#E4B94F" stroke-width="1" opacity="0.35"/>

  <g transform="translate(256,268)">
    <circle r="182" fill="none" stroke="url(#goldGrad)" stroke-width="2.4" opacity="0.35"/>
    <circle r="168" fill="none" stroke="#E4B94F" stroke-width="3.4" stroke-dasharray="1.5 11" stroke-linecap="round" opacity="0.7"/>

    <g fill="url(#goldGrad)" stroke="#7A5613" stroke-width="1">
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(45)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(225)"/>
      <use href="#petal" transform="rotate(270)"/>
