<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#5C1712"/>
      <stop offset="55%" stop-color="#33090A"/>
      <stop offset="100%" stop-color="#150304"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBEBB5"/>
      <stop offset="45%" stop-color="#E4B94F"/>
      <stop offset="100%" stop-color="#A67A1E"/>
    </linearGradient>

    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDF4D6"/>
      <stop offset="100%" stop-color="#E9C877"/>
